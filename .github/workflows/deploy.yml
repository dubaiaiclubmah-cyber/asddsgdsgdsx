# Build the Vite production bundle and deploy it to GitHub Pages.
# Only the contents of `dist/` (compiled HTML/JS/CSS) are published —
# never the raw source files or the dev entry point.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  # Allow running this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN for the deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the
# run in-progress and latest queued. However, do NOT cancel in-progress
# runs as we want to allow these production deployments to complete.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # The repository is served from this subpath on GitHub Pages:
  # https://dubaiaiclubmah-cyber.github.io/asddsgdsgdsx/
  BASE_PATH: /asddsgdsgdsx/

jobs:
  build:
    name: Build production bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for GitHub Pages
        # Production build with the correct base path for this repository,
        # so all JS/CSS/image URLs resolve under /asddsgdsgdsx/.
        run: npx vite build --base=${{ env.BASE_PATH }} --outDir dist

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dist/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
